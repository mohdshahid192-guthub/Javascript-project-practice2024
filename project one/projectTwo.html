<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
      body {
  background-color: #f0f0f0;
  font-family: "Poppins", sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
  align-items: center;
}

#timer {
  font-size: 7rem;
  font-weight: 700;
  text-shadow: 2px 2px #f8a5c2;
  color: #f92672;
  width: 600px;
  text-align: center;
  margin: 40px auto;
}

#buttons {
  display: flex;
  justify-content: center;
}

button {
  background-color: #f92672;
  color: white;
  border: none;
  font-size: 2rem;
  font-weight: bold;
  padding: 1.5rem 4rem;
  margin: 1rem;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
  transition: all 0.2s;
}

button:hover {
  background-color: #f44583;
  box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
}

button[disabled] {
  opacity: 0.5;
  cursor: default;
}

@media (max-width: 800px) {
  #timer {
    font-size: 4rem;
    width: 350px;
  }

  button {
    font-size: 1.5rem;
    padding: 1rem 2rem;
  }
}
    </style>
   
</head>
<body>

    <div id="timer">00:00:000</div>
    <div id="buttons">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
        <button id="reset">Reset</button>
    </div>
    
</body>
<script>
  const timer = document.getElementById('timer')
  const start = document.getElementById('start')
  const stopT = document.getElementById('stop')
  const reset = document.getElementById('reset')

  let timeInterval = null;
  let totalSeconds = 0;

  start.addEventListener("click", () => {
    toStartTimer();
    
  });

stopT.addEventListener('click', () => { 
    toStopTimer();
  })

  reset.addEventListener('click', () => {
    toResetTimer();
  })

  
    
 

  function toStartTimer(){
   if (timeInterval) {
    return;
   }else{
    timeInterval = setInterval(() =>{
      totalSeconds++;
      timer.innerText = formatTime(totalSeconds)
    }, 1);;
 }
  }

  function toStopTimer(){
   clearInterval(timeInterval);
   timeInterval = null;

  }

  function toResetTimer(){
   toStopTimer();
   totalSeconds = 0;
   timer.innerText = formatTime(totalSeconds);

  }



  function formatTime(mili) {
    const min = Math.floor(mili / 60000);
    const secs = Math.floor((mili % 60000)/ 1000);
    const milisec = mili % 1000;

    // Pad single digits with a leading zero
    const displaymin = min.toString().padStart(2, '0');
    const displaysecs = secs.toString().padStart(2, '0');
    const displaymilisec = milisec.toString().padStart(3, '0').substring(0, 2);

    return `${displaymin}:${displaysecs}:${displaymilisec}`;
}

 
  

</script>
</html>
